services:
  db:
    image: mysql:8.0
    container_name: familyfeud_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-feud_root_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-family_feud}
      MYSQL_USER: ${MYSQL_USER:-family-feud-user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-123}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:-feud_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - familyfeud-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: familyfeud_backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${PORT:-5000}
      NODE_ENV: ${NODE_ENV:-production}
      CLIENT_URL: ${CLIENT_URL:-http://localhost}
      DATABASE_URL: mysql://${MYSQL_USER:-family-feud-user}:${MYSQL_PASSWORD:-123}@db:3306/${MYSQL_DATABASE:-family_feud}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.0-flash}
    ports:
      - "${PORT:-5000}:${PORT:-5000}"
    networks:
      - familyfeud-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: familyfeud_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - familyfeud-network

volumes:
  db_data:
    driver: local

networks:
  familyfeud-network:
    driver: bridge
