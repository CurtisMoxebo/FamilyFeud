name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - master
      - dev
      - develop
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - main
      - master
      - dev

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ==========================================
  # Backend Regression Tests
  # ==========================================
  backend-regression-tests:
    name: Backend Regression Tests (Vitest + Supertest)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: "mysql://root:root@localhost:3306/family_feud"

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./backend
        run: npx prisma generate

      - name: Compile Backend TypeScript
        working-directory: ./backend
        run: npm run build

      - name: Execute Backend Regression Tests
        working-directory: ./backend
        run: npx vitest run --reporter=verbose --reporter=github

      - name: Publish Backend Test Summary
        if: always()
        run: |
          echo "### 📡 Backend Regression Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Specs**: REST API (Health check), Socket.io real-time sync, Prisma client delegates" >> $GITHUB_STEP_SUMMARY
          echo "- **Framework**: Vitest v4 + Supertest" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # Frontend Regression Tests
  # ==========================================
  frontend-regression-tests:
    name: Frontend Regression Tests (Vitest + React Testing Library)
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Validate TypeScript & Build Bundle
        working-directory: ./frontend
        run: npm run build

      - name: Execute Frontend Regression Tests
        working-directory: ./frontend
        run: npx vitest run --reporter=verbose --reporter=github

      - name: Publish Frontend Test Summary
        if: always()
        run: |
          echo "### 💻 Frontend Regression Test Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Test Specs**: App landing page, useSocket hook lifecycle, Game Show Theme tokens" >> $GITHUB_STEP_SUMMARY
          echo "- **Framework**: Vitest v4 + @testing-library/react + jsdom" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # Docker Container Build Verification
  # ==========================================
  docker-build-check:
    name: Docker Build Validation
    runs-on: ubuntu-latest
    needs: [backend-regression-tests, frontend-regression-tests]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false
          tags: familyfeud-backend:ci-check

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false
          tags: familyfeud-frontend:ci-check
