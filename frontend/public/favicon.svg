<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="42%" r="55%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="55%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0a1536" />
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="45%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>
  </defs>

  <!-- Outer Gold Oval Crest -->
  <ellipse cx="32" cy="32" rx="30" ry="26" fill="url(#goldGrad)" />
  <ellipse cx="32" cy="32" rx="27" ry="23" fill="#09132c" />
  <ellipse cx="32" cy="32" rx="25.5" ry="21.5" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Marquee Lights -->
  <g fill="#fef08a">
    <circle cx="32" cy="7.5" r="1.3" />
    <circle cx="44" cy="10" r="1.2" />
    <circle cx="54" cy="17" r="1.2" />
    <circle cx="59" cy="32" r="1.3" />
    <circle cx="54" cy="47" r="1.2" />
    <circle cx="44" cy="54" r="1.2" />
    <circle cx="32" cy="56.5" r="1.3" />
    <circle cx="20" cy="54" r="1.2" />
    <circle cx="10" cy="47" r="1.2" />
    <circle cx="5" cy="32" r="1.3" />
    <circle cx="10" cy="17" r="1.2" />
    <circle cx="20" cy="10" r="1.2" />
  </g>

  <!-- Red Accent Banner Bar -->
  <rect x="11" y="29" width="42" height="6" rx="3" fill="url(#redGrad)" stroke="#facc15" stroke-width="0.8" />

  <!-- Drop Shadow for FF Monogram -->
  <g fill="#060d21" opacity="0.75" transform="translate(1.5, 2)">
    <!-- Left F -->
    <path d="M16 19 H30 V24 H21.5 V29.5 H28.5 V34.5 H21.5 V45 H16 Z" />
    <!-- Right F -->
    <path d="M33 19 H47 V24 H38.5 V29.5 H45.5 V34.5 H38.5 V45 H33 Z" />
  </g>

  <!-- Gold FF Monogram -->
  <g fill="url(#goldGrad)" stroke="#713f12" stroke-width="0.6">
    <!-- Left F -->
    <path d="M16 19 H30 V24 H21.5 V29.5 H28.5 V34.5 H21.5 V45 H16 Z" />
    <!-- Right F -->
    <path d="M33 19 H47 V24 H38.5 V29.5 H45.5 V34.5 H38.5 V45 H33 Z" />
  </g>
</svg>
